name: Python checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Build wheel
        run: python -m build

      # Wheel встановлюється в чисте середовище без dev-залежностей і запускається як CLI.
      - name: Install wheel into clean environment and run CLI
        shell: bash
        run: |
          python -m venv .venv-wheel
          if [ -x .venv-wheel/Scripts/python.exe ]; then PY=.venv-wheel/Scripts/python.exe; else PY=.venv-wheel/bin/python; fi
          "$PY" -m pip install --no-deps dist/*.whl
          "$PY" -m kzp_lab06.cli data/input.csv reports/wheel-summary.txt
          diff reports/wheel-summary.txt reports/summary.txt
          set +e
          "$PY" -m kzp_lab06.cli data/broken.csv reports/broken-summary.txt
          code=$?
          set -e
          echo "exit code for broken CSV: $code"
          test "$code" -eq 2

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: kzp-lab06-wheel-${{ matrix.os }}
          path: dist/*.whl
